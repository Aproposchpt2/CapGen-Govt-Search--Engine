[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "18"
    PDF_RENDERER = "adobe"
    SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[functions."send-contractor-outreach"]
  timeout = 30

[functions."generate-capability-background"]
  external_node_modules = ["adm-zip"]

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/sms-consent"
  to = "/sms-consent.html"
  status = 200

[[redirects]]
  from = "/pipeline"
  to = "/pipeline-dashboard.html"
  status = 200

# Retired CapGen public aliases now consolidate into the live RFCP property.
[[redirects]]
  from = "/capgen"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/apropos"
  to = "/dashboard.html"
  status = 301
  force = true

[[redirects]]
  from = "/ag-dashboard.html"
  to = "/dashboard.html"
  status = 301
  force = true

[[redirects]]
  from = "/pro"
  to = "/onboarding"
  status = 301
  force = true

[[redirects]]
  from = "/pro/thankyou"
  to = "/onboarding"
  status = 301
  force = true

[[redirects]]
  from = "/offer"
  to = "/onboarding"
  status = 301
  force = true

[[redirects]]
  from = "/welcome"
  to = "/welcome.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/onboarding.html"
  status = 200

# Voucher redemption remains operational inside RFCP; build-time cleanup removes retired branding.
[[redirects]]
  from = "/redeem"
  to = "/capgen-redeem.html"
  status = 200

[[redirects]]
  from = "/signin"
  to = "/onboarding.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/onboarding.html"
  status = 200

[[redirects]]
  from = "/login.html"
  to = "/onboarding.html"
  status = 301
  force = true

[[redirects]]
  from = "/member-login"
  to = "/onboarding.html"
  status = 301
  force = true

[[redirects]]
  from = "/capability-report"
  to = "/capability-report.html"
  status = 200

[[redirects]]
  from = "/demo/report"
  to = "/demo-report.html"
  status = 200

[[redirects]]
  from = "/demo/snapshot"
  to = "/demo-snapshot.html"
  status = 200

[[redirects]]
  from = "/beta/welcome"
  to = "/beta-welcome.html"
  status = 200

[[redirects]]
  from = "/admin/leads"
  to = "/admin-leads.html"
  status = 200

[[redirects]]
  from = "/ops-outreach"
  to = "/ops-outreach.html"
  status = 200

[[redirects]]
  from = "/ops-dashboard"
  to = "/ops-dashboard.html"
  status = 200

# Canonical Registered Federal Contractors Portal procurement command center.
[[redirects]]
  from = "/ops-command-center"
  to = "/ops-command-center-v5.html"
  status = 200
  force = true

[[headers]]
  for = "/ops-command-center-stage01-hotfix.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://judislfknmhofcgzyozc.supabase.co wss://judislfknmhofcgzyozc.supabase.co https://www.google-analytics.com; frame-src 'self' https://buy.stripe.com; worker-src 'self' blob:; form-action 'self' https://buy.stripe.com"

[[headers]]
  for = "/ops-*"
  [headers.values]
    Cache-Control = "no-store, private"
