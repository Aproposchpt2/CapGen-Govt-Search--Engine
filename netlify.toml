[build]
  command = "node scripts/apply-ngcc-tablet-sticky-execution.cjs && node scripts/apply-ngcc-it-search-preset.cjs && node scripts/apply-ngcc-qualification-v2-ui.cjs && node scripts/apply-ngcc-research-routing-v1.cjs && node scripts/apply-ngcc-stage05-auto-queue-gate.cjs && node scripts/apply-ngcc-outreach-review-v1.cjs && node scripts/apply-ngcc-marketplace-claim-email-v1.cjs && node scripts/apply-ngcc-controlled-test-delivery-v1.cjs && node scripts/apply-rfc-portal-vat-remediation-01.cjs && node scripts/validate-rfc-portal-vat-remediation-01.cjs && node scripts/apply-rfc-portal-vat-remediation-02.cjs && node scripts/validate-rfc-portal-vat-remediation-02.cjs && node scripts/apply-rfc-portal-internal-contract-workspace.cjs && node scripts/validate-rfc-portal-internal-contract-workspace.cjs && node scripts/validate-rfc-portal-vat-remediation-04.cjs && node scripts/apply-rfcp-primary-identity.cjs && node scripts/validate-rfcp-primary-identity.cjs && node scripts/validate-rfcp-wave1-authority.cjs && node scripts/apply-live-property-allowlist.cjs"
  publish = "."
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "18"
    PDF_RENDERER = "adobe"
    SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[functions."send-contractor-outreach"]
  timeout = 30

[functions."generate-capability-background"]
  external_node_modules = ["adm-zip"]

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/sms-consent"
  to = "/sms-consent.html"
  status = 200

[[redirects]]
  from = "/pipeline"
  to = "/pipeline-dashboard.html"
  status = 200

# Retired CapGen public aliases now consolidate into the live RFCP property.
[[redirects]]
  from = "/capgen"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/apropos"
  to = "/dashboard.html"
  status = 301
  force = true

[[redirects]]
  from = "/ag-dashboard.html"
  to = "/dashboard.html"
  status = 301
  force = true

[[redirects]]
  from = "/pro"
  to = "/onboarding"
  status = 301
  force = true

[[redirects]]
  from = "/pro/thankyou"
  to = "/onboarding"
  status = 301
  force = true

[[redirects]]
  from = "/offer"
  to = "/onboarding"
  status = 301
  force = true

[[redirects]]
  from = "/welcome"
  to = "/welcome.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/onboarding.html"
  status = 200

# Voucher redemption remains operational inside RFCP; build-time cleanup removes retired branding.
[[redirects]]
  from = "/redeem"
  to = "/capgen-redeem.html"
  status = 200

[[redirects]]
  from = "/signin"
  to = "/onboarding.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/onboarding.html"
  status = 200

[[redirects]]
  from = "/login.html"
  to = "/onboarding.html"
  status = 301
  force = true

[[redirects]]
  from = "/member-login"
  to = "/onboarding.html"
  status = 301
  force = true

[[redirects]]
  from = "/capability-report"
  to = "/capability-report.html"
  status = 200

[[redirects]]
  from = "/demo/report"
  to = "/demo-report.html"
  status = 200

[[redirects]]
  from = "/demo/snapshot"
  to = "/demo-snapshot.html"
  status = 200

[[redirects]]
  from = "/beta/welcome"
  to = "/beta-welcome.html"
  status = 200

[[redirects]]
  from = "/admin/leads"
  to = "/admin-leads.html"
  status = 200

[[redirects]]
  from = "/ops-outreach"
  to = "/ops-outreach.html"
  status = 200

[[redirects]]
  from = "/ops-dashboard"
  to = "/ops-dashboard.html"
  status = 200

# Canonical Registered Federal Contractors Portal procurement command center.
[[redirects]]
  from = "/ops-command-center"
  to = "/ops-command-center-v5.html"
  status = 200
  force = true

[[headers]]
  for = "/ops-command-center-stage01-hotfix.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
