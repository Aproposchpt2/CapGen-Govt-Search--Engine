<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Federal Contract Workspace</title>
<style>:root{--bg:#061126;--panel:#0d1d3b;--line:rgba(255,255,255,.13);--text:#f7f9ff;--muted:#a9b6cd;--cyan:#64d8ff;--gold:#d7b25d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#061126,#020813);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}.shell{width:min(1040px,calc(100% - 28px));margin:auto;padding:28px 0 50px}.card{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:16px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;text-decoration:none;border-radius:9px;padding:.72rem 1rem;font-weight:700;cursor:pointer}.btn.primary{background:var(--cyan);color:#05213b;border-color:transparent}.hero{padding:8px 0 16px}.eyebrow{color:var(--gold);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}.hero h1{font:400 clamp(2rem,5vw,3.1rem) Georgia,serif;margin:.5rem 0}.hero p{color:var(--muted)}.card{padding:20px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{padding:12px;border:1px solid var(--line);border-radius:10px}.field b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{color:var(--muted);padding:30px;text-align:center}.error{color:#ffd0d5}.note{font-size:.78rem;color:var(--muted);margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="shell"><main id="workspace"><div class="status">Loading contract workspace…</div></main></div>
<script>(()=>{'use strict';const root=document.getElementById('workspace'),q=new URLSearchParams(location.search),id=q.get('id')||'',token=sessionStorage.getItem('pipeline_session')||localStorage.getItem('pipeline_session')||'';const headers=()=>token?{Accept:'application/json',Authorization:'Bearer '+token}:{Accept:'application/json'};const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const fmt=v=>{if(!v)return'Not provided';const d=new Date(v);return Number.isNaN(d.valueOf())?String(v):new Intl.DateTimeFormat(undefined,{dateStyle:'medium'}).format(d)};
async function init(){if(!id){root.innerHTML='<div class="status error">No contract was selected.</div>';return}try{const r=await fetch('/api/federal-contract?id='+encodeURIComponent(id),{headers:headers()}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Contract workspace could not be loaded.');const c=d.contract||{},pop=c.place_of_performance||{},state=pop?.state?.code||pop?.state?.name||'Not provided';root.innerHTML=`<section class="hero"><div class="eyebrow">Federal Contract Opportunity</div><h1>${esc(c.title)}</h1><p>${esc(c.agency)}</p></section><section class="card"><div class="grid"><div class="field"><b>Solicitation</b>${esc(c.solicitation_number||'Not provided')}</div><div class="field"><b>NAICS</b>${esc(c.naics_code||'Not provided')}</div><div class="field"><b>Response Deadline</b>${esc(fmt(c.response_deadline))}</div><div class="field"><b>Place of Performance</b>${esc(state)}</div><div class="field"><b>Set-Aside</b>${esc(c.set_aside||'Not specified')}</div><div class="field"><b>Notice Type</b>${esc(c.notice_type||'Not specified')}</div></div><div class="actions">${d.package?.available?'<button class="btn primary" id="downloadBtn" type="button">Download Contract Package</button>':''}</div><div class="note">Contract information is presented inside the Apropos platform. Official-source provenance is retained internally.</div></section>`;const dl=document.getElementById('downloadBtn');if(dl)dl.addEventListener('click',()=>downloadPackage(d.package.download_url))}catch(e){root.innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
async function downloadPackage(url){const button=document.getElementById('downloadBtn');try{button.disabled=true;button.textContent='Preparing Contract Package…';const r=await fetch(url,{headers:headers()});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'Contract package could not be prepared.')}const blob=await r.blob(),cd=r.headers.get('content-disposition')||'',m=cd.match(/filename="?([^";]+)"?/i),name=m?m[1]:'APROPOS_Federal_Contract_Package.zip',a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);button.textContent='Download Contract Package'}catch(e){alert(e.message);button.textContent='Download Contract Package'}finally{button.disabled=false}}
init()})();</script></body></html>
