<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Federal Opportunity Workspace | RFCP</title><style>body{margin:0;background:#08142a;color:#edf3ff;font:16px/1.55 Arial,sans-serif}.shell{max-width:900px;margin:auto;padding:24px}.top,.card{background:#11213f;border:1px solid #344a70;border-radius:13px;padding:20px;margin-bottom:16px}.brand{font-weight:800;color:#d5ae55}.muted{color:#aebbd0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fact{background:#0b1932;padding:12px;border-radius:8px}.fact b{display:block;color:#9eb0ca;font-size:.75rem;text-transform:uppercase}a{color:#7dd3fc}.btn{display:inline-block;background:#d5ae55;color:#071126;text-decoration:none;padding:11px 16px;border-radius:7px;font-weight:800}.error{color:#ffb8c0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="top"><div class="brand">REGISTERED FEDERAL CONTRACTORS PORTAL · RFCP</div><p class="muted">Secure Federal Opportunity Workspace</p></header><div id="root" class="card">Loading the verified opportunity record…</div></main><script>const root=document.getElementById('root'),token=new URLSearchParams(location.search).get('t')||'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{if(!token){root.innerHTML='<p class="error">This workspace link is missing or invalid.</p>';return}const r=await fetch('/.netlify/functions/ngcc-federal-workspace?t='+encodeURIComponent(token)),d=await r.json().catch(()=>({}));if(!r.ok){root.innerHTML='<p class="error">'+esc(d.error||'This workspace is unavailable.')+'</p>';return}const o=d.opportunity||{},docs=d.documents||[];root.innerHTML='<h1>'+esc(o.title||'Federal contract opportunity')+'</h1><p>'+esc(o.agency||'Federal agency')+'</p><div class="grid"><div class="fact"><b>Solicitation</b>'+esc(o.solicitation_number||o.notice_id||'Not provided')+'</div><div class="fact"><b>NAICS</b>'+esc(o.naics_code||'Not provided')+'</div><div class="fact"><b>Response deadline</b>'+esc(o.response_deadline||'Not provided')+'</div><div class="fact"><b>Package state</b>'+esc(d.package?.note||'Availability is not confirmed.')+'</div></div><h2>Available public package resources</h2>'+(docs.length?'<ul>'+docs.map(x=>'<li><a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">'+esc(x.label)+'</a></li>').join('')+'</ul>':'<p class="muted">No public attachments were found. RFCP does not represent this package as complete.</p>')+'<p class="muted">SAM.gov and the issuing agency remain authoritative. Restricted files may require direct authorized access.</p><p><a class="btn" href="/onboarding.html">Sign in to RFCP for Analyze Fit</a></p>'})();</script></body></html>
