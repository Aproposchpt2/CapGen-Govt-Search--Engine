<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Analyze Fit Report | NGCC</title><link rel="stylesheet" href="/assets/analyze-fit-readable.css"></head><body>
<header class="toolbar"><div class="toolbar-inner"><div class="toolbar-brand"><img src="/assets/apropos-group-logo.jpg" alt="APROPOS GROUP LLC"><div>NGCC Analyze Fit<small>APROPOS Government Opportunity Intelligence</small></div></div><div class="actions"><a class="btn" id="backBtn" href="/opportunity">Return to Opportunity</a><button class="btn white" id="printBtn" disabled>Print / Save PDF</button><button class="btn primary" id="wordBtn" disabled>Download Word Report</button></div></div></header>
<div class="status" id="status">Preparing the executive opportunity assessment…</div><main class="report" id="report" hidden></main>
<script>
'use strict';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),noticeId=q.get('id')||'',token=q.get('t')||localStorage.getItem('demo_view_token')||'',session=JSON.parse(sessionStorage.getItem('capgen_session')||'null'),sessionToken=session?.session_token||'',betaToken=token.startsWith('beta_')?token:'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),arr=v=>Array.isArray(v)?v:[],text=v=>String(v??'').trim(),clip=(v,n=280)=>{const s=text(v).replace(/\s+/g,' ');return s.length>n?s.slice(0,n-1).trim()+'…':s},field=(...v)=>v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=='')||'',fmt=v=>{const d=v?new Date(v):null;return d&&!Number.isNaN(d.valueOf())?d.toLocaleString():'Not provided'};let opp=JSON.parse(sessionStorage.getItem('analyze_opp')||'null'),profile={},analysisRow=null,polling=null;
$('backBtn').href=token?'/opportunity?t='+encodeURIComponent(token):'/opportunity';
const list=(items,max=5)=>{const v=arr(items).map(x=>text(x?.item??x)).filter(Boolean).slice(0,max);return v.length?`<ul class="clean-list">${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p><em>Not identified in the available evidence.</em></p>'};
const tone=v=>{const s=text(v).toLowerCase();return /critical/.test(s)?'critical':/high|gap|no.bid|do not/.test(s)?'high':/strong|aligned|bid|pursue|low/.test(s)?'strong':/medium|partial|conditional|verify|unknown|information/.test(s)?'medium':'information'};
const recLabel=v=>{const s=text(v).toUpperCase();return s==='BID'||s==='PURSUE'?'GO':s==='NO_BID'||s==='DO_NOT_PURSUE'?'DO NOT PURSUE':'CONDITIONAL GO'};
function head(n,title,deck,meta){return `<div class="page-head"><div class="page-brand"><img src="/assets/apropos-group-logo.jpg" alt=""><div>APROPOS GROUP LLC<span>Government Opportunity Intelligence</span></div></div><div class="page-meta">${esc(meta)}<br>Page ${n} of 6</div></div><div class="page-number">${String(n).padStart(2,'0')}</div><h1 class="page-title">${esc(title)}</h1><p class="page-deck">${esc(deck)}</p>`}
const foot=n=>`<div class="page-foot"><span>CONFIDENTIAL · Prepared by APROPOS GROUP LLC</span><span>Page ${n}</span></div>`;
function banner(score,rec){return `<div class="decision-banner"><div class="score"><b>${esc(score)}</b><small>FIT SCORE / 100</small></div><div class="rec"><b>${esc(recLabel(rec))}</b><span>${recLabel(rec)==='CONDITIONAL GO'?'Close mandatory conditions before authorization.':recLabel(rec)==='GO'?'Proceed after official-source validation.':'Resolve disqualifying findings before pursuit.'}</span></div><div class="ready">${recLabel(rec)==='GO'?'READY TO VALIDATE':recLabel(rec)==='DO NOT PURSUE'?'NOT READY':'CONDITIONAL'}<small>PROPOSAL READINESS</small></div></div>`}
function facts(o,standard){const raw=o.raw||{},pop=raw.placeOfPerformance||{};const rows=[['Agency',o.agency],['Solicitation / Record',o.solicitation_number||o.notice_id||noticeId],['Response Deadline',fmt(o.response_deadline||o.deadline)],['Place of Performance',[pop?.city?.name,pop?.state?.code].filter(Boolean).join(', ')||'Not provided'],['NAICS',o.naics_code||o.naics],['Report Standard',standard]];return `<dl class="facts">${rows.map(([k,v])=>`<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v||'Not provided')}</dd></div>`).join('')}</dl>`}
function fitCards(stage1,stage2){const match=stage1.match||{},req=arr(stage2.required_work).slice(0,4),staff=arr(stage2.staffing_delivery),docs=arr(stage2.documents_needed);const level=text(match.capability_alignment||'VERIFY').toUpperCase();const cards=req.map((r,i)=>({requirement:r,rating:level==='HIGH'?(i<2?'STRONG':'PARTIAL'):level==='LOW'?(i?'GAP':'PARTIAL'):'PARTIAL',evidence:i===0?field(match.capability_detail,profile.capabilities,'Reported capability evidence requires validation.'):i===1?field(profile.past_performance,'Comparable past performance not supplied.'):field(staff[i-2],profile.capabilities,'Requirement-specific evidence not supplied.'),action:field(docs[i],staff[i],'Map named evidence and an owner to this requirement.')}));return `<div class="fit-grid">${cards.map(x=>`<article class="fit-card"><h3>${esc(x.requirement)}</h3><span class="status-tag ${tone(x.rating)}">${esc(x.rating)}</span><p><strong>Evidence:</strong> ${esc(x.evidence)}</p><p><strong>Close:</strong> ${esc(x.action)}</p></article>`).join('')||'<p>No requirement-level findings were returned.</p>'}</div>`}
function eligibility(stage1,o){const m=stage1.match||{},items=[{factor:'NAICS alignment',status:m.naics_match===true?'STRONG':m.naics_match===false?'GAP':'VERIFY',detail:m.naics_detail,note:'Confirm the official NAICS and current registration.'},{factor:'Set-aside eligibility',status:m.set_aside_eligible===true?'ALIGNED':m.set_aside_eligible===false?'GAP':'VERIFY',detail:m.set_aside_detail,note:'Use only current documented eligibility.'},{factor:'Response deadline',status:o.response_deadline||o.deadline?'VERIFY':'UNKNOWN',detail:fmt(o.response_deadline||o.deadline),note:'Confirm amendments and the controlling deadline.'}];return `<div class="eligibility-grid">${items.map(x=>`<article class="eligibility"><h3>${esc(x.factor)}</h3><span class="status-tag ${tone(x.status)}">${esc(x.status)}</span><p>${esc(x.detail||'Not provided')}</p><p><em>${esc(x.note)}</em></p></article>`).join('')}</div>`}
function risks(stage1,stage2){const m=stage1.match||{},items=[];if(m.set_aside_eligible===false)items.push({domain:'Set-aside eligibility',level:'HIGH',finding:m.set_aside_detail||'Required eligibility is not established.',mitigation:'Do not pursue unless current records establish eligibility.'});if(text(m.capability_alignment).toUpperCase()!=='HIGH')items.push({domain:'Capability evidence',level:text(m.capability_alignment).toUpperCase()==='LOW'?'HIGH':'MEDIUM',finding:'Requirement-level proof is incomplete or indirect.',mitigation:'Build a requirement-to-evidence matrix with named proof.'});if(!profile.past_performance||/not specified/i.test(profile.past_performance))items.push({domain:'Past performance',level:'HIGH',finding:'Comparable project evidence was not substantiated.',mitigation:'Identify comparable contracts, outcomes and references.'});if(arr(stage2.staffing_delivery).length)items.push({domain:'Staffing and delivery',level:'MEDIUM',finding:stage2.staffing_delivery[0],mitigation:'Confirm named personnel, credentials and surge coverage.'});if(arr(stage2.documents_needed).length>=5)items.push({domain:'Compliance burden',level:'HIGH',finding:'The response requires a substantial document package.',mitigation:'Create a compliance matrix with owners and closure dates.'});if(arr(stage2.pricing_considerations).length)items.push({domain:'Pricing and margin',level:'MEDIUM',finding:stage2.pricing_considerations[0],mitigation:'Validate direct cost, indirect rates, cash flow and price-to-win.'});while(items.length<4)items.push({domain:'Official-source verification',level:'INFORMATION',finding:'Available metadata must be reconciled to the complete solicitation.',mitigation:'Review the official notice, attachments, amendments and Q&A.'});return items}
function riskCards(items){return `<div class="risk-grid">${items.slice(0,4).map(x=>`<article class="risk-card ${tone(x.level)}"><h3>${esc(x.domain)}</h3><span class="status-tag ${tone(x.level)}">${esc(x.level)}</span><p><strong>Why:</strong> ${esc(x.finding)}</p><p><strong>Mitigation:</strong> ${esc(x.mitigation)}</p></article>`).join('')}</div>`}
function actionGrid(stage2){const check=arr(stage2.proposal_checklist).map(x=>x?.item||x),blocks=[['01','Immediate / 24 hours',[arr(stage2.documents_needed)[0],'Confirm deadline, submission method and minimum qualifications','Verify SAM, UEI, NAICS and representations']],['02','Next 72 hours',[check[0],'Complete the past-performance evidence matrix',arr(stage2.staffing_delivery)[0]]],['03','First week / review',[check[1],'Conduct a formal bid / no-bid review','Record conditions, owners and closure dates']]];return `<div class="action-grid">${blocks.map(([n,t,i])=>`<article class="action"><div class="num">${n}</div><h3>${t}</h3>${list(i.filter(Boolean),3)}</article>`).join('')}</div>`}
function conditions(items){return `<div class="conditions">${arr(items).slice(0,4).map((x,i)=>`<div class="condition"><b>${i+1}</b><span>${esc(x)}</span></div>`).join('')}</div>`}
function showStatus(message,type=''){const el=$('status');el.hidden=false;el.className=`status ${type}`;el.textContent=message}
async function loadContext(){if(token&&!betaToken){try{const r=await fetch('/.netlify/functions/demo-pipeline?t='+encodeURIComponent(token));if(r.ok){const d=await r.json();profile=d.profile||d.business||d.snapshot?.profile||{};if(!opp&&Array.isArray(d.opportunities))opp=d.opportunities.find(x=>(x.notice_id||x.noticeId||x.id)===noticeId)||null}}catch{}}if(noticeId){try{const r=await fetch('https://judislfknmhofcgzyozc.supabase.co/rest/v1/sam_opportunities?notice_id=eq.'+encodeURIComponent(noticeId)+'&select=title,agency,naics_code,set_aside,response_deadline,solicitation_number,raw&limit=1',{headers:{apikey:'eyJhbGciOiJIUzI1NiIsInJlZiI6Imp1ZGlzbGZrbm1ob2ZjZ3p5b3pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMDI3ODAsImV4cCI6MjA5Mjc3ODc4MH0.Kxpe0kJt0k7ZchYu70BOwm4KdT0C5aSsyeR1ov6NlQ0'}});const rows=await r.json();if(rows[0]){const row=rows[0],existing=opp||{},raw=row.raw||existing.raw||{};opp={...existing,...raw,title:field(row.title,existing.title,raw.title),agency:field(row.agency,existing.agency,raw.fullParentPathName),naics_code:field(row.naics_code,existing.naics_code,raw.naicsCode),set_aside:field(row.set_aside,existing.set_aside,raw.typeOfSetAsideDescription),response_deadline:field(row.response_deadline,existing.response_deadline,raw.responseDeadLine),solicitation_number:field(row.solicitation_number,existing.solicitation_number,raw.solicitationNumber,noticeId),notice_id:noticeId,raw}}}catch{}}}
function render(row){analysisRow=row;const s1=row.stage1||{},s2=row.stage2||{},o=opp||{},business=field(profile.legal_name,profile.business_name,profile.name,session?.business_name,'Client Organization'),score=row.fit_score??s1.fit_score??'—',rec=row.recommendation||s1.recommendation||'CONDITIONAL',sol=field(o.solicitation_number,o.notice_id,noticeId,'Not provided'),standard='APROPOS-ANALYZE-FIT-READABLE-v2',meta=`${sol} · ${new Date().toLocaleDateString()}`,strengths=[s1.match?.naics_match===true?'Direct NAICS alignment':'',s1.match?.set_aside_eligible===true?'Reported set-aside alignment':'',s1.match?.capability_detail].filter(Boolean),concerns=[...arr(s1.conditions),!profile.past_performance||/not specified/i.test(profile.past_performance)?'Comparable past performance is not substantiated':'','The complete official solicitation and amendments must control the final decision.'].filter(Boolean),riskItems=risks(s1,s2),high=riskItems.filter(x=>/HIGH|CRITICAL/i.test(x.level)).length;const pages=[];
pages.push(`<section class="report-page cover"><img class="cover-logo" src="/assets/apropos-group-logo.jpg" alt="APROPOS GROUP LLC"><div class="cover-kicker">ANALYZE FIT REPORT</div><h1>Business-to-Contract Fit Assessment</h1><div class="cover-sub">A readable executive decision report</div><div class="prepared"><small>PREPARED FOR</small><strong>${esc(business)}</strong><b>${esc(o.title||s1._title||'Selected Opportunity')}</b><div>${esc(o.agency||s1._agency||'Federal Agency')} · ${esc(sol)}</div></div>${banner(score,rec)}<p>${standard} · Prepared ${new Date().toLocaleDateString()}</p>${foot(1)}</section>`);
pages.push(`<section class="report-page">${head(2,'Executive Decision Summary','The decision, in plain language, before the detailed analysis.',meta)}${banner(score,rec)}<div class="callout"><h2>EXECUTIVE SUMMARY</h2><p>${esc(s1.opportunity_summary||'This assessment compares the selected opportunity with the available contractor profile.')}</p></div><p>${esc(s1.rationale||'The recommendation reflects capability alignment, eligibility, evidence quality, schedule, compliance burden and delivery risk.')}</p><div class="two-col"><div class="list-card green"><h3>Why the opportunity fits</h3>${list(strengths,4)}</div><div class="list-card amber"><h3>Why the decision is conditional or negative</h3>${list(concerns,4)}</div></div><div class="callout red"><h3>DECISION RULE</h3><p>${recLabel(rec)==='GO'?'Authorize pursuit after official-source and evidence validation.':recLabel(rec)==='DO NOT PURSUE'?'Do not commit proposal resources unless disqualifying findings are resolved.':'Do not authorize final bid production until every mandatory eligibility, evidence, staffing, pricing and compliance condition is closed.'}</p></div>${foot(2)}</section>`);
pages.push(`<section class="report-page">${head(3,'Fit Analysis','A readable comparison of the business profile against the actual contract evidence.',meta)}<h2 class="section-label">Opportunity overview</h2>${facts(o,standard)}<h2 class="section-label">Business-to-requirement fit</h2>${fitCards(s1,s2)}<h2 class="section-label">Eligibility and readiness gates</h2>${eligibility(s1,o)}${foot(3)}</section>`);
pages.push(`<section class="report-page">${head(4,'Risk Assessment','The most consequential pursuit and performance risks, presented as readable decision cards.',meta)}${riskCards(riskItems)}<div class="callout red"><h3>RISK POSTURE</h3><p>${high?`The assessment identifies ${high} high or critical risk finding${high===1?'':'s'}. Close every displayed risk before authorization.`:'No high-risk item is visible, but unknown and incomplete evidence must still be closed.'}</p></div>${foot(4)}</section>`);
pages.push(`<section class="report-page">${head(5,'Proposal Development Plan','A controlled validation and preparation sequence—not a generic checklist.',meta)}${actionGrid(s2)}<div class="two-col" style="margin-top:12px"><div class="list-card"><h3>Documents and evidence needed</h3>${list(s2.documents_needed,4)}</div><div class="list-card"><h3>Questions for the contracting officer</h3>${list(s2.questions_for_co,4)}</div></div>${foot(5)}</section>`);
pages.push(`<section class="report-page">${head(6,'Executive Recommendation','The formal management gate and the evidence required to support it.',meta)}${banner(score,rec)}<div class="callout"><h3>FINAL RECOMMENDATION</h3><p>${esc(s1.rationale||'Complete every mandatory validation gate before authorization.')}</p></div><h2 class="section-label">Conditions for authorization</h2>${conditions(s1.conditions.length?s1.conditions:concerns)}<div class="management"><h3>MANAGEMENT DECISION</h3><div class="choices"><span>☐ APPROVE PURSUIT</span><span>☐ APPROVE WITH CONDITIONS</span><span>☐ DO NOT PURSUE</span></div><div class="signatures"><span>Authorized Executive / Signature</span><span>Date</span><span>Decision Record ID</span></div></div><h2 class="section-label">Source notes and limitations</h2>${list(['Business profile available to NGCC','Opportunity metadata and official notice information','Official solicitation, amendments and current registrations control'],4)}${foot(6)}</section>`);
$('report').innerHTML=pages.join('');$('report').hidden=false;$('status').hidden=true;$('printBtn').disabled=false;$('wordBtn').disabled=false}
async function analyze(force=false){if(!noticeId){showStatus('No opportunity identifier was supplied.','error');return}if(!sessionToken&&!token){showStatus('A valid personalized dashboard link is required.','error');return}try{const r=await fetch('/.netlify/functions/analyze-fit',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionToken},body:JSON.stringify({opportunityId:noticeId,force,deep:true,view_token:token||undefined,beta_token:betaToken||undefined,opportunity:opp?{title:opp.title,agency:opp.agency,naics:opp.naics||opp.naics_code,set_aside:opp.set_aside,deadline:opp.response_deadline||opp.deadline,solicitation_number:opp.solicitation_number}:undefined})}),d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'Analysis could not be completed.');if(d.status==='failed')throw new Error(d.stage1?.error||'The assessment process failed.');if(d.status==='complete'&&d.stage1){render(d);return}showStatus(d.status==='stage1_complete'?'Executive recommendation complete. Building the full report…':'Analyzing alignment, eligibility, evidence and risk…');polling=setTimeout(()=>analyze(false),1800)}catch(e){showStatus(e.message,'error')}}
async function downloadWord(){if(!analysisRow)return;const btn=$('wordBtn');btn.disabled=true;btn.textContent='Building Word Report…';try{const r=await fetch('/.netlify/functions/analyze-fit-docx',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionToken},body:JSON.stringify({opportunityId:noticeId,view_token:token||undefined,beta_token:betaToken||undefined,opportunity:opp})});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Word report could not be generated.');const blob=await r.blob(),a=document.createElement('a'),cd=r.headers.get('content-disposition')||'',m=cd.match(/filename="?([^";]+)"?/i);a.href=URL.createObjectURL(blob);a.download=m?.[1]||'APROPOS_Analyze_Fit_Report.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){showStatus(e.message,'error')}finally{btn.disabled=false;btn.textContent='Download Word Report'}}
$('printBtn').onclick=()=>print();$('wordBtn').onclick=downloadWord;(async()=>{await loadContext();analyze(false)})();
</script></body></html>
