name: RFC PR61 Build Diagnostics

on:
  push:
    branches:
      - agent/rfc-portal-critical-internal-contract-workspace

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: 01 tablet sticky execution
        run: node scripts/apply-ngcc-tablet-sticky-execution.cjs
      - name: 02 IT search preset
        run: node scripts/apply-ngcc-it-search-preset.cjs
      - name: 03 qualification UI
        run: node scripts/apply-ngcc-qualification-v2-ui.cjs
      - name: 04 research routing
        run: node scripts/apply-ngcc-research-routing-v1.cjs
      - name: 05 Stage05 queue gate
        run: node scripts/apply-ngcc-stage05-auto-queue-gate.cjs
      - name: 06 outreach review
        run: node scripts/apply-ngcc-outreach-review-v1.cjs
      - name: 07 marketplace claim email
        run: node scripts/apply-ngcc-marketplace-claim-email-v1.cjs
      - name: 08 controlled test delivery
        run: node scripts/apply-ngcc-controlled-test-delivery-v1.cjs
      - name: 09 VAT pass01 apply
        run: node scripts/apply-rfc-portal-vat-remediation-01.cjs
      - name: 10 VAT pass01 validate
        run: node scripts/validate-rfc-portal-vat-remediation-01.cjs
      - name: 11 VAT pass02 apply
        run: node scripts/apply-rfc-portal-vat-remediation-02.cjs
      - name: 12 VAT pass02 validate
        run: node scripts/validate-rfc-portal-vat-remediation-02.cjs
      - name: 13 Internal workspace apply
        run: node scripts/apply-rfc-portal-internal-contract-workspace.cjs
      - name: 14A1 Dashboard has internal contract route
        run: node -e "const a=require('node:assert/strict'),s=require('node:fs').readFileSync('dashboard.html','utf8');a.match(s,/\\/federal-contract\\.html\\?id=/)"
      - name: 14A2 Dashboard removes official-listing action
        run: node -e "const a=require('node:assert/strict'),s=require('node:fs').readFileSync('dashboard.html','utf8');a.doesNotMatch(s,/View Official Listing/i)"
      - name: 14A3 Dashboard has no SAM.gov hyperlink
        run: node -e "const a=require('node:assert/strict'),s=require('node:fs').readFileSync('dashboard.html','utf8');a.doesNotMatch(s,/href=[\"'\x60][^\"'\x60]*sam\\.gov/i)"
      - name: 14A4 Dashboard does not consume ui_link
        run: node -e "const a=require('node:assert/strict'),s=require('node:fs').readFileSync('dashboard.html','utf8');a.doesNotMatch(s,/r\\.ui_link|ui_link\\s*:/)"
      - name: 14B Federal match payload
        run: node -e "const a=require('node:assert/strict'),s=require('node:fs').readFileSync('netlify/functions/ngcc-federal-matches.mjs','utf8');a.doesNotMatch(s,/ui_link\\s*:/);a.doesNotMatch(s,/https:\\/\\/sam\\.gov/i)"
      - name: 14C Contract detail boundary
        run: node -e "const a=require('node:assert/strict'),s=require('node:fs').readFileSync('netlify/functions/ngcc-federal-contract.mjs','utf8');a.match(s,/loadProfileSession/);a.match(s,/\\/api\\/federal-contract-package\\?id=/);a.doesNotMatch(s,/https:\\/\\/sam\\.gov|ui_link\\s*:/i)"
      - name: 14D Package boundary
        run: node -e "const a=require('node:assert/strict'),s=require('node:fs').readFileSync('netlify/functions/ngcc-federal-contract-package.mjs','utf8');a.match(s,/loadProfileSession/);a.match(s,/new Response\\(bytes/);a.match(s,/fetchableUpstreamUrl/);a.doesNotMatch(s,/official_sam_url|source_url\\s*:/i);a.doesNotMatch(s,/Use the official SAM\\.gov|direct SAM\\.gov access/i)"
      - name: 14E Workspace page boundary
        run: node -e "const a=require('node:assert/strict'),s=require('node:fs').readFileSync('federal-contract.html','utf8');a.match(s,/Federal Contract Workspace/);a.match(s,/Download Contract Package/);a.match(s,/Analyze Fit — \\$79/);a.doesNotMatch(s,/href=[\"'\x60][^\"'\x60]*sam\\.gov/i)"
      - name: 14F Full internal workspace validator
        run: node scripts/validate-rfc-portal-internal-contract-workspace.cjs
      - name: 15 VAT pass04 validate
        run: node scripts/validate-rfc-portal-vat-remediation-04.cjs
      - name: 16 Syntax check new functions
        run: |
          node --check netlify/functions/ngcc-federal-contract.mjs
          node --check netlify/functions/ngcc-federal-contract-package.mjs
