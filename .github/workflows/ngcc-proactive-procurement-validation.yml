name: NGCC Proactive Procurement Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ops-command-center*.html"
      - "_headers"
      - "netlify.toml"
      - "netlify/functions/lib/ngcc-*.js"
      - "netlify/functions/ngcc-ops-*.js"
      - "netlify/functions/ngcc-federal-*.js"
      - "supabase/migrations/*ngcc*.sql"
      - "tests/ngcc-*.test.js"
      - ".github/workflows/ngcc-proactive-procurement-validation.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Syntax check protected operator and federal workspace functions
        run: |
          node --check netlify/functions/lib/ngcc-procurement-dna.js
          node --check netlify/functions/lib/ngcc-contract-intelligence.js
          node --check netlify/functions/lib/ngcc-contractor-discovery.js
          node --check netlify/functions/lib/ngcc-contractor-qualification.js
          node --check netlify/functions/lib/ngcc-contact-discovery.js
          node --check netlify/functions/lib/ngcc-outreach-control.js
          node --check netlify/functions/lib/ngcc-response-closeout.js
          node --check netlify/functions/lib/ngcc-mission-state.js
          node --check netlify/functions/lib/ngcc-federal-workspace.js
          node --check netlify/functions/ngcc-ops-sam-opportunities.js
          node --check netlify/functions/ngcc-ops-contract-dna.js
          node --check netlify/functions/ngcc-ops-derive-naics.js
          node --check netlify/functions/ngcc-ops-business-search-dna.js
          node --check netlify/functions/ngcc-ops-sam-contractor-discovery.js
          node --check netlify/functions/ngcc-ops-contractor-qualification.js
          node --check netlify/functions/ngcc-ops-contact-discovery.js
          node --check netlify/functions/ngcc-ops-controlled-outreach.js
          node --check netlify/functions/ngcc-ops-response-contract-assistance.js
          node --check netlify/functions/ngcc-ops-mission-control.js
          node --check netlify/functions/ngcc-ops-mission-evidence.js
          node --check netlify/functions/ngcc-federal-claim.js
          node --check netlify/functions/ngcc-federal-workspace.js
          node --check netlify/functions/ngcc-federal-package.js
      - name: Validate Contract DNA and Business Search DNA
        run: node tests/ngcc-procurement-dna.test.js
      - name: Validate controlled SAM contractor discovery
        run: node tests/ngcc-contractor-discovery.test.js
      - name: Validate explainable contractor qualification
        run: node tests/ngcc-contractor-qualification.test.js
      - name: Validate Stage 06/07 operator gates
        run: node tests/ngcc-contact-outreach-control.test.js
      - name: Validate Stage 08 response and closeout
        run: node tests/ngcc-response-closeout.test.js
      - name: Validate strict sequential mission execution
        run: node tests/ngcc-mission-state.test.js
      - name: Validate current v5 command center, floating shell, and federal workspace wiring
        run: |
          grep -Fq '<title>NGCC Command Center</title>' ops-command-center-v5.html
          grep -Fq 'ops-command-center-v3.html?v5=4' ops-command-center-v5.html
          grep -Fq 'ngcc-ops-mission-evidence' ops-command-center-v5.html
          grep -Fq 'id="contractState"' ops-command-center-v5.html
          grep -Fq 'id="contractorState"' ops-command-center-v5.html
          grep -Fq 'Start New Task' ops-command-center-v5.html
          grep -Fq 'ngcc-contract-drawer' ops-command-center-v5.html
          grep -Fq 'ngccFloatingExecutionHost' ops-command-center-v7.html
          grep -Fq 'position:sticky;top:58px' ops-command-center-v7.html
          grep -Fq '/ops-command-center-v5.html' ops-command-center-v7.html
          grep -Fq "params.set('state', state)" netlify/functions/ngcc-ops-sam-opportunities.js
          grep -Fq 'resourceLinks' netlify/functions/ngcc-ops-sam-opportunities.js
          grep -Fq 'Opportunity Reference' netlify/functions/ngcc-ops-outreach.js
          grep -Fq 'issueWorkspaceToken' netlify/functions/ngcc-federal-claim.js
          grep -Fq 'PUBLIC_PACKAGE_ACQUIRED' netlify/functions/ngcc-federal-package.js
          grep -Fq "physicalAddressProvinceOrStateCode" netlify/functions/lib/ngcc-ops.js
          grep -Fq 'Cache-Control: no-store' _headers
          grep -Fq 'to = "/ops-command-center-v7.html"' netlify.toml
          grep -Fq 'for = "/ops-command-center-v5.html"' netlify.toml
          grep -Fq 'X-Frame-Options = "SAMEORIGIN"' netlify.toml
