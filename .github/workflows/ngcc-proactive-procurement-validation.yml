name: NGCC Proactive Procurement Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ops-command-center*.html"
      - "scripts/apply-ngcc-*.cjs"
      - "_headers"
      - "netlify.toml"
      - "netlify/functions/lib/ngcc-*.js"
      - "netlify/functions/ngcc-ops-*.js"
      - "netlify/functions/ngcc-federal-*.js"
      - "supabase/migrations/*ngcc*.sql"
      - "tests/ngcc-*.test.js"
      - ".github/workflows/ngcc-proactive-procurement-validation.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Syntax check protected operator and federal workspace functions
        run: |
          node --check netlify/functions/lib/ngcc-procurement-dna.js
          node --check netlify/functions/lib/ngcc-contract-intelligence.js
          node --check netlify/functions/lib/ngcc-contractor-discovery.js
          node --check netlify/functions/lib/ngcc-contractor-capability-verification.js
          node --check netlify/functions/lib/ngcc-contractor-qualification.js
          node --check netlify/functions/lib/ngcc-contractor-store.js
          node --check netlify/functions/lib/ngcc-contact-discovery.js
          node --check netlify/functions/lib/ngcc-outreach-control.js
          node --check netlify/functions/lib/ngcc-response-closeout.js
          node --check netlify/functions/lib/ngcc-mission-state.js
          node --check netlify/functions/lib/ngcc-federal-workspace.js
          node --check netlify/functions/ngcc-ops-sam-opportunities.js
          node --check netlify/functions/ngcc-ops-contract-dna.js
          node --check netlify/functions/ngcc-ops-derive-naics.js
          node --check netlify/functions/ngcc-ops-business-search-dna.js
          node --check netlify/functions/ngcc-ops-sam-contractor-discovery.js
          node --check netlify/functions/ngcc-ops-contractor-qualification.js
          node --check netlify/functions/ngcc-ops-contact-discovery.js
          node --check netlify/functions/ngcc-ops-contact-discovery-background.js
          node --check netlify/functions/ngcc-ops-controlled-outreach.js
          node --check netlify/functions/ngcc-ops-response-contract-assistance.js
          node --check netlify/functions/ngcc-ops-mission-control.js
          node --check netlify/functions/ngcc-ops-mission-evidence.js
          node --check netlify/functions/ngcc-federal-claim.js
          node --check netlify/functions/ngcc-federal-workspace.js
          node --check netlify/functions/ngcc-federal-package.js
          node --check scripts/apply-ngcc-tablet-sticky-execution.cjs
          node --check scripts/apply-ngcc-qualification-v2-ui.cjs
          node --check scripts/apply-ngcc-persistent-agent-ui.cjs
          node --check scripts/apply-ngcc-stage06-live-sync.cjs
          node --check tests/ngcc-command-center-build.test.js
          node --check tests/ngcc-persistent-agent-state.test.js
      - name: Validate Contract DNA and Business Search DNA
        run: node tests/ngcc-procurement-dna.test.js
      - name: Validate controlled SAM contractor discovery
        run: node tests/ngcc-contractor-discovery.test.js
      - name: Validate current public capability evidence controls
        run: node tests/ngcc-contractor-capability-verification.test.js
      - name: Validate explainable contractor qualification
        run: node tests/ngcc-contractor-qualification.test.js
      - name: Validate five-agent Stage 06 completion gate
        run: node tests/ngcc-persistent-agent-state.test.js
      - name: Validate Stage 06/07 website and outreach gates
        run: node tests/ngcc-contact-outreach-control.test.js
      - name: Validate Stage 08 response and closeout
        run: node tests/ngcc-response-closeout.test.js
      - name: Validate strict sequential mission execution
        run: node tests/ngcc-mission-state.test.js
      - name: Apply command-center production build patches
        run: |
          node scripts/apply-ngcc-tablet-sticky-execution.cjs
          node scripts/apply-ngcc-qualification-v2-ui.cjs
      - name: Parse built command-center JavaScript
        run: node tests/ngcc-command-center-build.test.js
      - name: Validate certified v5 command center and federal workspace wiring
        run: |
          failed=0
          check() {
            file="$1"
            needle="$2"
            label="$3"
            if grep -Fq -- "$needle" "$file"; then
              echo "PASS: $label"
            else
              echo "MISSING: $label :: $needle in $file"
              failed=1
            fi
          }
          check ops-command-center-v5.html '<title>NGCC Command Center</title>' 'v5 title'
          check ops-command-center-v5.html 'ops-command-center-v3.html?v5=4' 'v5 source loader'
          check ops-command-center-v5.html 'ngcc-ops-mission-evidence' 'mission evidence persistence'
          check ops-command-center-v5.html 'id="contractState"' 'contract state control'
          check ops-command-center-v5.html 'id="contractorState"' 'contractor state control'
          check ops-command-center-v5.html 'Start New Task' 'new task control'
          check ops-command-center-v5.html 'ngcc-contract-drawer' 'contract drawer'
          check ops-command-center-v5.html "executionDock.className='ngcc-execution-dock'" 'sticky execution dock'
          check ops-command-center-v5.html 'Discovery Match' 'discovery match UI'
          check ops-command-center-v5.html 'Contract Qualification' 'contract qualification UI'
          check ops-command-center-v5.html 'Not scored' 'no false qualification score'
          check ops-command-center-v3.html 'Website & Contact Discovery' 'Stage 06 label'
          check ops-command-center-v3.html 'official_website_url' 'website evidence UI'
          check scripts/apply-ngcc-persistent-agent-ui.cjs 'Stage 06 Agent Monitor' 'five-agent monitor'
          check scripts/apply-ngcc-persistent-agent-ui.cjs 'ngcc-ops-contact-discovery-background' 'background worker launch'
          check scripts/apply-ngcc-persistent-agent-ui.cjs 'search_run_id:evidence.search_run_id' 'search run continuity'
          check scripts/apply-ngcc-stage06-live-sync.cjs 'ngccStage06LiveSync' 'live execution/staging synchronization'
          check scripts/apply-ngcc-stage06-live-sync.cjs 'renderStage06Agents(state)' 'agent monitor synchronization'
          check netlify/functions/lib/ngcc-contact-discovery.js 'CONTACT DISCOVERY IS THE PRIMARY TASK.' 'website-first research policy'
          check netlify/functions/ngcc-ops-contact-discovery.js 'READY_TO_START_BACKGROUND' 'persist-before-background gate'
          check netlify/functions/ngcc-ops-contact-discovery.js 'createContactAgents' 'agent assignment persistence'
          check netlify/functions/ngcc-ops-sam-contractor-discovery.js 'startSearchRun' 'durable SAM search runs'
          check netlify/functions/ngcc-ops-contractor-qualification.js 'persistQualifications' 'durable qualification results'
          check netlify/functions/ngcc-ops-contact-discovery-background.js 'Promise.all' 'concurrent Stage 06 agents'
          check netlify/functions/ngcc-ops-contact-discovery-background.js 'progress_percentage: 100' 'terminal agent progress'
          check netlify/functions/ngcc-ops-contact-discovery-background.js 'agentSummary.all_terminal' 'all-agent completion gate'
          check netlify/functions/lib/ngcc-mission-state.js "['CONTACT_DISCOVERY', 'Website & Contact Discovery']" 'canonical Stage 06 mission label'
          check netlify/functions/ngcc-ops-sam-opportunities.js "params.set('state', state)" 'SAM state filter'
          check netlify/functions/ngcc-ops-sam-opportunities.js 'resourceLinks' 'SAM resource links'
          check netlify/functions/ngcc-ops-outreach.js 'Opportunity Reference' 'claim reference outreach'
          check netlify/functions/ngcc-federal-claim.js 'issueWorkspaceToken' 'federal claim workspace token'
          check netlify/functions/ngcc-federal-package.js 'PUBLIC_PACKAGE_ACQUIRED' 'federal package acquisition'
          check netlify/functions/lib/ngcc-ops.js 'physicalAddressProvinceOrStateCode' 'SAM contractor state normalization'
          check netlify/functions/lib/ngcc-ops.js 'entityRegistration,coreData,assertions' 'SAM entity sections'
          check _headers 'Cache-Control: no-store' 'operator no-store headers'
          check netlify.toml 'apply-ngcc-tablet-sticky-execution.cjs && node scripts/apply-ngcc-qualification-v2-ui.cjs' 'production build patch chain'
          check netlify.toml 'to = "/ops-command-center-v5.html"' 'canonical command center redirect'
          check netlify.toml 'X-Frame-Options = "DENY"' 'frame protection'
          test "$failed" -eq 0
