name: RFCP Production Identity Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "netlify.toml"
      - "scripts/apply-rfcp-primary-identity.cjs"
      - "scripts/apply-nonblocking-fonts.cjs"
      - "scripts/validate-rfcp-primary-identity.cjs"
      - ".github/workflows/ngcc-production-correction.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "netlify.toml"
      - "scripts/apply-rfcp-primary-identity.cjs"
      - "scripts/apply-nonblocking-fonts.cjs"
      - "scripts/validate-rfcp-primary-identity.cjs"
      - ".github/workflows/ngcc-production-correction.yml"

permissions:
  contents: read

jobs:
  validate-primary-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final portal identity build step
        run: node scripts/apply-rfcp-primary-identity.cjs

      - name: Validate SEO, schema, entity graph, crawl signals, and performance contract
        run: node scripts/validate-rfcp-primary-identity.cjs

      - name: Verify homepage contains no alternate schema identity
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '"alternateName"' index.html
          grep -Fq '<div class="lsub">Federal Procurement Intelligence</div>' index.html
          grep -Fq 'https://federalcontractorportal.aproposgroupllc.com/#organization' index.html
          grep -Fq 'https://federalcontractorportal.aproposgroupllc.com/#website' index.html
          grep -Fq 'https://federalcontractorportal.aproposgroupllc.com/#service' index.html
          grep -Fq 'https://federalcontractorportal.aproposgroupllc.com/#faq' index.html
          grep -Fq 'APROPOS Marketing Marketplace' index.html

      - name: Verify crawl assets
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Sitemap: https://federalcontractorportal.aproposgroupllc.com/sitemap.xml' robots.txt
          grep -Fq '<loc>https://federalcontractorportal.aproposgroupllc.com/</loc>' sitemap.xml

      - name: Verify social image dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('og-ngcc.jpg')
          if not p.exists():
              raise SystemExit('social image missing')
          data = p.read_bytes()
          i = 2
          width = height = None
          while i < len(data) - 9:
              if data[i] != 0xFF:
                  i += 1
                  continue
              marker = data[i+1]
              i += 2
              if marker in (0xD8, 0xD9):
                  continue
              length = struct.unpack('>H', data[i:i+2])[0]
              if marker in range(0xC0, 0xC4):
                  height, width = struct.unpack('>HH', data[i+3:i+7])
                  break
              i += length
          if (width, height) != (1200, 630):
              raise SystemExit(f'unexpected social image size: {(width, height)}')
          print('PASS: social image is 1200x630')
          PY
