name: NGCC Production Correction

on:
  push:
    branches: [fix-ngcc-production-metadata-v1]
    paths: [".github/workflows/ngcc-production-correction.yml"]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "og-ngcc.jpg"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/ngcc-production-correction.yml"

permissions:
  contents: write

jobs:
  correct-validate-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate corrected homepage and crawl assets
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          html = '''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
