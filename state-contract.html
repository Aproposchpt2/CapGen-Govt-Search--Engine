<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>State Contract Workspace | Registered Federal Contractors Portal</title>
<style>:root{--bg:#061126;--panel:#0d1d3b;--line:rgba(255,255,255,.13);--text:#f7f9ff;--muted:#a9b6cd;--cyan:#64d8ff;--gold:#d7b25d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#061126,#020813);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}.shell{width:min(1040px,calc(100% - 28px));margin:auto;padding:18px 0 50px}.top,.card{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:16px}.top{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:700}.brand small{display:block;font-size:.68rem;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;text-decoration:none;border-radius:9px;padding:.72rem 1rem;font-weight:700;cursor:pointer}.hero{padding:28px 0 16px}.eyebrow{color:var(--gold);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}.hero h1{font:400 clamp(2rem,5vw,3.1rem) Georgia,serif;margin:.5rem 0}.hero p{color:var(--muted)}.card{padding:20px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{padding:12px;border:1px solid var(--line);border-radius:10px}.field b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}.desc{white-space:pre-wrap;line-height:1.6;color:#dbe4f5;font-size:.92rem}.status{color:var(--muted);padding:30px;text-align:center}.error{color:#ffd0d5}.note{font-size:.78rem;color:var(--muted);margin-top:10px}h3.section-h{margin:20px 0 10px;font-family:Georgia,serif;font-weight:400;font-size:1.25rem}.doc-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}.doc-list li{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.doc-name{display:flex;flex-direction:column;gap:2px;min-width:0}.doc-name>span:first-child{color:var(--text);font-weight:700;font-size:.84rem;word-break:break-word}.doc-actions{display:flex;gap:14px;flex-shrink:0}.doc-list a{color:var(--cyan);font-weight:700;text-decoration:none;font-size:.78rem}.doc-list a:hover{text-decoration:underline}.doc-hint{margin-top:6px;font-size:.7rem}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><div class="shell"><header class="top"><div class="brand">Registered Federal Contractors Portal<small>State Contract Workspace</small></div><a class="btn" href="/dashboard.html">← Back to Contract Matches</a></header><main id="workspace"><div class="status">Loading your contract workspace…</div></main></div>
<script>(()=>{'use strict';const root=document.getElementById('workspace'),q=new URLSearchParams(location.search),id=q.get('id')||'',token=sessionStorage.getItem('pipeline_session')||localStorage.getItem('pipeline_session')||'';const headers=()=>token?{Accept:'application/json',Authorization:'Bearer '+token}:{Accept:'application/json'};const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const fmt=v=>{if(!v)return'Not provided';const d=new Date(v);return Number.isNaN(d.valueOf())?String(v):new Intl.DateTimeFormat(undefined,{dateStyle:'medium'}).format(d)};function formatBytes(n){n=Number(n||0);if(!n)return'';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(0)+' KB';return(n/1048576).toFixed(1)+' MB'}
async function loadPackage(opportunityId){const section=document.getElementById('packageSection');try{const r=await fetch('/api/state-contract-documents',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({opportunity_id:opportunityId})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'The solicitation package could not be loaded.');if(!d.documents.length){section.innerHTML='<h3 class="section-h">Contract Package</h3><p class="note">No documents have been acquired for this contract yet.</p>';return}section.innerHTML=`<h3 class="section-h">Contract Package</h3><p class="note">${d.count} document${d.count===1?'':'s'} acquired directly from the issuing agency.</p><ul class="doc-list">${d.documents.map(doc=>doc.url?`<li><div class="doc-name"><span>${esc(doc.filename)}</span><span class="note">${esc(doc.document_type_label)}${doc.byte_size?' · '+formatBytes(doc.byte_size):''}</span></div><div class="doc-actions"><a href="${esc(doc.url)}" target="_blank" rel="noopener">View</a>${doc.download_url?`<a href="${esc(doc.download_url)}">Download</a>`:''}</div></li>`:`<li><div class="doc-name"><span>${esc(doc.filename)}</span><span class="note">${esc(doc.document_type_label)} · temporarily unavailable</span></div></li>`).join('')}</ul><p class="note doc-hint">View opens the document in your browser's own viewer. Download saves a copy with the original filename.</p>`}catch(e){section.innerHTML='<h3 class="section-h">Contract Package</h3><p class="note">'+esc(e.message)+'</p>'}}
async function init(){if(!id){root.innerHTML='<div class="status error">No contract was selected.</div>';return}try{const r=await fetch('/api/state-contract?id='+encodeURIComponent(id),{headers:headers()}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Contract workspace could not be loaded.');const c=d.contract||{};root.innerHTML=`<section class="hero"><div class="eyebrow">State &amp; Local Contract Opportunity</div><h1>${esc(c.title)}</h1><p>${esc(c.agency)}${c.jurisdiction_name?' · '+esc(c.jurisdiction_name):''}</p></section><section class="card"><div class="grid"><div class="field"><b>Solicitation</b>${esc(c.solicitation_number||'Not provided')}</div><div class="field"><b>State</b>${esc(c.state_code||'Not provided')}</div><div class="field"><b>Response Deadline</b>${esc(fmt(c.response_deadline))}</div><div class="field"><b>County</b>${esc(c.place_of_performance_county||'Not specified')}</div><div class="field"><b>Procurement Type</b>${esc(c.procurement_type||'Not specified')}</div><div class="field"><b>Documents on File</b>${c.package_document_count?c.package_document_count+' document'+(c.package_document_count===1?'':'s'):'None acquired yet'}</div></div>${c.description?`<h3 class="section-h">Description</h3><div class="desc">${esc(c.description)}</div>`:''}<div id="packageSection">${c.package_document_count?'<p class="note">Loading the acquired documents…</p>':'<h3 class="section-h">Contract Package</h3><p class="note">No documents have been acquired for this contract. Analyze Fit will report that limitation and will not imply a complete package.</p>'}</div><h3 class="section-h">Why this appeared</h3><p class="note">State/local discovery uses capability and procurement-term evidence from your verified business profile against the opportunity title and description. SAM NAICS did not contribute to this match. Keyword alignment does not prove eligibility or package completeness.</p><p><a class="btn" href="/analyze-fit.html?source=state_local&amp;id=${encodeURIComponent(id)}">Analyze Fit</a></p><div class="note">Inventory source: official State/local government record retained by RFCP.</div></section>`;if(c.package_document_count)loadPackage(id)}catch(e){root.innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
init()})();</script></body></html>
