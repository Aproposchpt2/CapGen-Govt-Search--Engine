<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>State Contract Workspace | Registered Federal Contractors Portal</title>
<style>:root{--bg:#061126;--panel:#0d1d3b;--line:rgba(255,255,255,.13);--text:#f7f9ff;--muted:#a9b6cd;--cyan:#64d8ff;--gold:#d7b25d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#061126,#020813);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}.shell{width:min(1040px,calc(100% - 28px));margin:auto;padding:18px 0 50px}.top,.card{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:16px}.top{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:700}.brand small{display:block;font-size:.68rem;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;text-decoration:none;border-radius:9px;padding:.72rem 1rem;font-weight:700;cursor:pointer}.hero{padding:28px 0 16px}.eyebrow{color:var(--gold);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}.hero h1{font:400 clamp(2rem,5vw,3.1rem) Georgia,serif;margin:.5rem 0}.hero p{color:var(--muted)}.card{padding:20px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{padding:12px;border:1px solid var(--line);border-radius:10px}.field b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}.desc{white-space:pre-wrap;line-height:1.6;color:#dbe4f5;font-size:.92rem}.status{color:var(--muted);padding:30px;text-align:center}.error{color:#ffd0d5}.note{font-size:.78rem;color:var(--muted);margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><div class="shell"><header class="top"><div class="brand">Registered Federal Contractors Portal<small>State Contract Workspace</small></div><a class="btn" href="/dashboard.html">← Back to Contract Matches</a></header><main id="workspace"><div class="status">Loading your contract workspace…</div></main></div>
<script>(()=>{'use strict';const root=document.getElementById('workspace'),q=new URLSearchParams(location.search),id=q.get('id')||'',token=sessionStorage.getItem('pipeline_session')||localStorage.getItem('pipeline_session')||'';const headers=()=>token?{Accept:'application/json',Authorization:'Bearer '+token}:{Accept:'application/json'};const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const fmt=v=>{if(!v)return'Not provided';const d=new Date(v);return Number.isNaN(d.valueOf())?String(v):new Intl.DateTimeFormat(undefined,{dateStyle:'medium'}).format(d)};
async function init(){if(!id){root.innerHTML='<div class="status error">No contract was selected.</div>';return}try{const r=await fetch('/api/state-contract?id='+encodeURIComponent(id),{headers:headers()}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Contract workspace could not be loaded.');const c=d.contract||{};root.innerHTML=`<section class="hero"><div class="eyebrow">State &amp; Local Contract Opportunity</div><h1>${esc(c.title)}</h1><p>${esc(c.agency)}${c.jurisdiction_name?' · '+esc(c.jurisdiction_name):''}</p></section><section class="card"><div class="grid"><div class="field"><b>Solicitation</b>${esc(c.solicitation_number||'Not provided')}</div><div class="field"><b>State</b>${esc(c.state_code||'Not provided')}</div><div class="field"><b>Response Deadline</b>${esc(fmt(c.response_deadline))}</div><div class="field"><b>County</b>${esc(c.place_of_performance_county||'Not specified')}</div><div class="field"><b>Procurement Type</b>${esc(c.procurement_type||'Not specified')}</div><div class="field"><b>Documents on File</b>${c.package_document_count?c.package_document_count+' document'+(c.package_document_count===1?'':'s'):'None acquired yet'}</div></div>${c.description?`<h3 style="margin:20px 0 8px;font-family:Georgia,serif;font-weight:400">Description</h3><div class="desc">${esc(c.description)}</div>`:''}<div class="note">Contract information is presented inside the Apropos portal. Official-source provenance is retained internally.</div></section>`}catch(e){root.innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
init()})();</script></body></html>
