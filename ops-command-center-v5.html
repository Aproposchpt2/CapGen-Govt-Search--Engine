<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>RFCP Command Center</title>
</head>
<body>
<script>
(async()=>{
  try {
    const res = await fetch('/ops-command-center-v3.html?v5=4', { cache: 'no-store' });
    if (!res.ok) throw new Error(`Unable to load command center (${res.status}).`);
    let html = await res.text();

    const originalSave = "function saveEvidence(){if(ctx?.mission?.id)sessionStorage.setItem(key(ctx.mission.id),JSON.stringify(evidence))}";
    const patchedSave = `function saveEvidence(){if(!ctx?.mission?.id)return;sessionStorage.setItem(key(ctx.mission.id),JSON.stringify(evidence));fetch('/.netlify/functions/ngcc-ops-mission-evidence',{method:'POST',headers:{'content-type':'application/json',...auth()},body:JSON.stringify({mission_id:ctx.mission.id,operational_state:evidence})}).catch(error=>console.error('[ngcc-mission-evidence]',error));}`;
    const originalLoad = "function loadEvidence(){try{evidence=JSON.parse(sessionStorage.getItem(key(ctx.mission.id))||'{}')}catch{evidence={}}}";
    const patchedLoad = `function loadEvidence(){let local={};try{local=JSON.parse(sessionStorage.getItem(key(ctx.mission.id))||'{}')}catch{local={}}const server=ctx?.mission?.operational_state&&typeof ctx.mission.operational_state==='object'?ctx.mission.operational_state:{};evidence={...server,...local};if(!evidence.opportunity&&ctx?.mission?.selected_opportunity_snapshot&&typeof ctx.mission.selected_opportunity_snapshot==='object'){evidence.opportunity=ctx.mission.selected_opportunity_snapshot;}sessionStorage.setItem(key(ctx.mission.id),JSON.stringify(evidence));if($('contractState')&&evidence.contract_state)$('contractState').value=evidence.contract_state;if($('contractorState')&&evidence.contractor_state)$('contractorState').value=evidence.contractor_state;}`;
    if (!html.includes(originalSave) || !html.includes(originalLoad)) throw new Error('Mission evidence patch markers were not found.');
    html = html.replace(originalSave, patchedSave).replace(originalLoad, patchedLoad);

    // Session behavior: a login opens a clean Task Execution workspace by default.
    // Only a mission selected in the current browser session is resumed on refresh.
    const originalLoadMissions = "async function loadMissions(){const d=await req('/.netlify/functions/ngcc-ops-mission-control');if(d.missions?.length)await openMission(d.missions[0].id);else render()}";
    const patchedLoadMissions = `async function loadMissions(){const resumeId=sessionStorage.getItem('ngcc_active_mission_id');if(resumeId){try{await openMission(resumeId);return}catch(error){console.warn('[ngcc-session-resume]',error);sessionStorage.removeItem('ngcc_active_mission_id')}}ctx=null;evidence={};render()}`;
    if (!html.includes(originalLoadMissions)) throw new Error('Mission session patch marker was not found.');
    html = html.replace(originalLoadMissions, patchedLoadMissions);

    // Preserve the generic federal-opportunity scope. Keyword, NAICS, and state
    // define the SAM.gov search; no small-business set-aside filter is forced.
    html = html.replace("<br><small>${esc(s.current_activity||'')}</small></div>", "<div class=\"progress\"><i style=\"width:${Math.max(0,Math.min(100,Number(s.progress_percentage||0)))}%\"></i></div><small>${Math.max(0,Math.min(100,Number(s.progress_percentage||0)))}% · ${esc(s.current_activity||'')}</small></div>");

    // State filters are intentionally separate: contract state means SAM.gov
    // place of performance; contractor state means SAM entity physical address.
    html = html.replace(
      '<div><label>NAICS</label><input id="naics" placeholder="optional"></div><div style="flex:0">',
      '<div><label>Search Category</label><select id="naicsPreset"><option value="">Custom NAICS</option><option value="it_core">Information Technology — Core (6 NAICS)</option><option value="it_full">Information Technology — Full (19 NAICS)</option></select><small class="muted">Choose an IT preset or enter NAICS manually.</small></div><div><label>NAICS</label><input id="naics" placeholder="optional"></div><div><label>Contract State</label><select id="contractState"><option value="">All States</option></select></div><div><label>Set-Aside</label><select id="setAside"><option value="">All Set-Asides</option><option value="SBA">Total Small Business (SBA)</option><option value="SBP">Partial Small Business (SBP)</option><option value="8A">8(a) Set-Aside (8A)</option><option value="8AN">8(a) Sole Source (8AN)</option><option value="HZC">HUBZone Set-Aside (HZC)</option><option value="HZS">HUBZone Sole Source (HZS)</option><option value="SDVOSBC">SDVOSB Set-Aside (SDVOSBC)</option><option value="SDVOSBS">SDVOSB Sole Source (SDVOSBS)</option><option value="WOSB">WOSB Set-Aside (WOSB)</option><option value="WOSBSS">WOSB Sole Source (WOSBSS)</option><option value="EDWOSB">EDWOSB Set-Aside (EDWOSB)</option><option value="EDWOSBSS">EDWOSB Sole Source (EDWOSBSS)</option><option value="LAS">Local Area Set-Aside (LAS)</option><option value="IEE">Indian Economic Enterprise (IEE)</option><option value="ISBEE">Indian Small Business Economic Enterprise (ISBEE)</option><option value="BICiv">Buy Indian Set-Aside (BICiv)</option><option value="VSA">Veteran-Owned Small Business Set-Aside (VSA)</option><option value="VSS">Veteran-Owned Small Business Sole Source (VSS)</option></select></div><div><label>Notice Type</label><select id="opportunityType"><option value="">All Notice Types</option><option value="o">Solicitation</option><option value="p">Pre-Solicitation</option><option value="k">Combined Synopsis/Solicitation</option><option value="r">Sources Sought</option><option value="s">Special Notice</option><option value="a">Award Notice</option><option value="u">Justification (J&amp;A)</option><option value="g">Sale of Surplus Property</option><option value="i">Intent to Bundle Requirements</option></select></div><div><label>Date Range</label><select id="dateRangePreset"><option value="90" selected>Last 90 Days</option><option value="60">Last 60 Days</option><option value="30">Last 30 Days</option><option value="custom">Custom</option></select></div><div><label>Posted From</label><input id="postedFrom" type="text" inputmode="numeric" placeholder="MM/DD/YYYY" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" autocomplete="off"><small class="muted">SAM format MM/DD/YYYY</small></div><div><label>Posted To</label><input id="postedTo" type="text" inputmode="numeric" placeholder="MM/DD/YYYY" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" autocomplete="off"><small class="muted">SAM format MM/DD/YYYY</small></div><div style="flex:0">'
    );
    html = html.replace(
      '<p id="execDesc" class="muted">Only the server-authorized next stage can execute.</p><button id="execute" class="btn" disabled>Execute Current Stage</button>',
      '<p id="execDesc" class="muted">Only the server-authorized next stage can execute.</p><label>Contractor State</label><select id="contractorState"><option value="">All States</option></select><small class="muted" style="display:block;margin:5px 0 9px">Applied at Stage 04 · SAM Contractor Discovery</small><button id="execute" class="btn" disabled>Execute Current Stage</button>'
    );
    html = html.replace(
      "body:JSON.stringify({business_search_dna:evidence.business_search_dna,limit:20})",
      "body:JSON.stringify({business_search_dna:evidence.business_search_dna,limit:20,state:($('contractorState')?.value||evidence.contractor_state||'')})"
    );

    const startMarker = "$('searchOpps').onclick=async()=>{";
    const endMarker = "async function transition(step,status,extra={})";
    const start = html.indexOf(startMarker);
    const end = html.indexOf(endMarker, start);
    if (start < 0 || end < 0) throw new Error('Stage 01 command-center patch markers were not found.');

    const replacement = `$('searchOpps').onclick=async()=>{const p=new URLSearchParams({limit:'30',page:'1'});if($('keyword').value.trim())p.set('title',$('keyword').value.trim());if($('naics').value.trim())p.set('naics',$('naics').value.trim());if($('contractState')?.value)p.set('state',$('contractState').value);if($('setAside')?.value)p.set('set_aside',$('setAside').value);if($('opportunityType')?.value)p.set('ptype',$('opportunityType').value);if($('postedFrom')?.value)p.set('postedFrom',$('postedFrom').value);if($('postedTo')?.value)p.set('postedTo',$('postedTo').value);$('searchOpps').disabled=true;$('opps').innerHTML='';$('oppsMsg').className='msg';try{const d=await req('/.netlify/functions/ngcc-ops-sam-opportunities?'+p);const results=Array.isArray(d.results)?d.results:[];const activeCount=Number.isFinite(Number(d.active_count))?Number(d.active_count):results.length;window.ngccContractDrawer?.setResults(results,{state:d.state||'',title:d.title||'',naics:(d.naicsCodes||[]).join(', ')},{page:d.page||1,has_previous:Boolean(d.has_previous),has_next:Boolean(d.has_next),total_records:d.total_records??null});if(d.search_status==='PARTIAL_SUCCESS'){$('oppsMsg').className=results.length?'msg ok':'msg';$('oppsMsg').textContent=activeCount+' active SAM.gov opportunities loaded'+(d.state?' for '+d.state:'')+'. '+Number(d.failed_paths||0)+' SAM.gov search path'+(Number(d.failed_paths||0)===1?'':'s')+' failed; results may be incomplete.';}else if(d.search_status==='SUCCESS_EMPTY'||activeCount===0){$('oppsMsg').className='msg ok';$('oppsMsg').textContent='0 active SAM.gov opportunities loaded'+(d.state?' for '+d.state:'')+' — no records matched the current filter combination.';}else{$('oppsMsg').className='msg ok';$('oppsMsg').textContent=activeCount+' active SAM.gov opportunities loaded'+(d.state?' for '+d.state:'')+'. Contract queue drawer populated.';}if(results.length)window.ngccContractDrawer?.open();else window.ngccContractDrawer?.close();}catch(e){$('oppsMsg').className='msg err';$('oppsMsg').textContent=e.message;window.ngccContractDrawer?.setResults([]);}finally{$('searchOpps').disabled=false}};
async function createMission(opp,button){try{const contractState=$('contractState')?.value||opp.state||'';if($('contractorState')&&!$('contractorState').value&&contractState)$('contractorState').value=contractState;const contractorState=$('contractorState')?.value||'';ctx=await req('/.netlify/functions/ngcc-ops-mission-control',{method:'POST',body:JSON.stringify({action:'create',opportunity:opp})});if(ctx?.mission?.id)sessionStorage.setItem('ngcc_active_mission_id',ctx.mission.id);evidence={opportunity:opp,contract_state:contractState,contractor_state:contractorState,ranked_candidates:[],contacts:[],outreach_result:null,reconciliation:null,closeout:null};saveEvidence();render();$('oppsMsg').className='msg ok';$('oppsMsg').textContent='Contract selected. Fresh mission created. Stage 02 — Contract DNA is READY; all later stages remain locked.';if(button){button.textContent='Selected ✓';button.disabled=true;}window.ngccContractDrawer?.close();}catch(e){$('oppsMsg').className='msg err';$('oppsMsg').textContent=e.message;if(button){button.disabled=false;button.textContent='Select Contract';}}}
`;
    html = html.slice(0, start) + replacement + html.slice(end);

    const stateFilterScript = `<script id="ngcc-state-filter-script">(()=>{const states=[['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming'],['PR','Puerto Rico'],['GU','Guam'],['VI','U.S. Virgin Islands'],['AS','American Samoa'],['MP','Northern Mariana Islands']];const fill=id=>{const el=document.getElementById(id);if(!el)return;const current=el.value;el.innerHTML='<option value="">All States</option>'+states.map(([c,n])=>'<option value="'+c+'">'+n+' ('+c+')</option>').join('');el.value=current||''};fill('contractState');fill('contractorState');const cs=document.getElementById('contractState'),rs=document.getElementById('contractorState');if(typeof evidence!=='undefined'){if(evidence.contract_state&&cs)cs.value=evidence.contract_state;if(evidence.contractor_state&&rs)rs.value=evidence.contractor_state}if(cs)cs.addEventListener('change',()=>{if(rs&&!rs.value&&cs.value)rs.value=cs.value;if(typeof evidence!=='undefined'&&ctx?.mission?.id){evidence.contract_state=cs.value;if(rs&&rs.value)evidence.contractor_state=rs.value;saveEvidence()}});if(rs)rs.addEventListener('change',()=>{if(typeof evidence!=='undefined'&&ctx?.mission?.id){evidence.contractor_state=rs.value;saveEvidence()}})})();<\/script>`;
    const dateRangeScript = `<script id="ngcc-date-range-script">(()=>{const preset=document.getElementById('dateRangePreset'),from=document.getElementById('postedFrom'),to=document.getElementById('postedTo');if(!preset||!from||!to)return;const pad=value=>String(value).padStart(2,'0');const format=date=>pad(date.getMonth()+1)+'/'+pad(date.getDate())+'/'+date.getFullYear();const apply=days=>{const end=new Date();end.setHours(12,0,0,0);const start=new Date(end);start.setDate(start.getDate()-days);from.value=format(start);to.value=format(end)};const applyPreset=()=>{const days=Number(preset.value);if(days===30||days===60||days===90)apply(days)};preset.addEventListener('change',()=>{if(preset.value==='custom'){from.focus();return}applyPreset()});const custom=()=>{if(preset.value!=='custom')preset.value='custom'};from.addEventListener('change',custom);to.addEventListener('change',custom);const newTask=document.getElementById('startNewTask');if(newTask)newTask.addEventListener('click',()=>setTimeout(()=>{preset.value='90';apply(90)},0));if(!from.value&&!to.value){preset.value='90';apply(90)}})();<\/script>`;
    const itSearchPresetScript = `<script id="ngcc-it-search-preset-script">(()=>{const PRESETS={it_core:['541511','541512','541519','518210','513210','541513'],it_full:['541511','541512','541519','518210','513210','541513','541715','541690','517111','517112','517410','517810','334111','334112','334118','334210','423430','611420','561320']};const preset=document.getElementById('naicsPreset'),naics=document.getElementById('naics');if(!preset||!naics)return;const valueFor=key=>(PRESETS[key]||[]).join(',');const apply=()=>{const value=valueFor(preset.value);if(value)naics.value=value};preset.addEventListener('change',apply);naics.addEventListener('input',()=>{if(preset.value&&naics.value.trim()!==valueFor(preset.value))preset.value=''});const newTask=document.getElementById('startNewTask');if(newTask)newTask.addEventListener('click',()=>setTimeout(()=>{preset.value=''},0))})();<\/script>`;
    html = html.replace('</body>', stateFilterScript + dateRangeScript + itSearchPresetScript + '</body>');

    const dashboardLink = '<a class="btn secondary" href="/ops-dashboard">Ops Dashboard</a>';
    if (!html.includes(dashboardLink)) throw new Error('Start New Task button marker not found.');
    html = html.replace(dashboardLink, '<button id="startNewTask" type="button" class="btn warn">Start New Task</button>' + dashboardLink);

    // Stage 05 v2: distinguish why a business was discovered from whether
    // current evidence shows it can perform this specific contract. A missing
    // qualification score is rendered as "Not scored" rather than a false 50%.
    const qualificationUiStart=html.indexOf("function renderRanked(){");
    const qualificationUiEnd=html.indexOf("function renderContacts(){",qualificationUiStart);
    if(qualificationUiStart<0||qualificationUiEnd<0)throw new Error('Stage 05 qualification v2 UI markers were not found.');
    const qualificationUiFunction=`function renderRanked(){const rows=evidence.ranked_candidates||[];if(!rows.length){$('ranked').innerHTML='<div class="muted">No Stage 05 output yet.</div>';return}const q=v=>Number.isFinite(Number(v))?Number(v):null;$('ranked').innerHTML=\`<table><thead><tr><th>Select</th><th>Rank</th><th>Business</th><th>Discovery Match</th><th>Contract Qualification</th><th>Status</th><th>Evidence</th></tr></thead><tbody>\${rows.map((c,i)=>{const discovery=q(c.discovery_match_score);const qualification=q(c.contract_qualification_score??c.qualification_score);const coverage=q(c.evidence_coverage_percentage);const visualStatus=c.qualification_status==='INSUFFICIENT_EVIDENCE'?'REVIEW_REQUIRED':c.qualification_status;return\`<tr><td><input type="checkbox" data-rank-select="\${i}" \${c.operator_selected?'checked':''} \${c.qualification_status==='DISQUALIFIED'?'disabled':''}></td><td>\${esc(c.rank)}</td><td><b>\${esc(c.business_name)}</b><br>\${esc(c.city||'')}\${c.state?', '+esc(c.state):''}</td><td><b>\${discovery===null?'—':esc(discovery)+'/100'}</b><br><small>\${esc(c.discovery_match_status||'Discovery evidence')}</small></td><td><b>\${qualification===null?'Not scored':esc(qualification)+'/100'}</b><br><small>\${coverage===null?'Evidence coverage unavailable':esc(coverage)+'% evidence coverage'}</small></td><td><span class="pill \${esc(visualStatus)}">\${esc(c.qualification_status)}</span></td><td><details><summary>Why ranked</summary>\${(c.explanation?.why_ranked||[]).map(x=>\`<div>• \${esc(x)}</div>\`).join('')}<div class="warntext">\${(c.explanation?.verification_required||[]).filter(x=>x.status==='UNVERIFIED').length} verification item(s)</div>\${(c.explanation?.verification_required||[]).filter(x=>x.status==='MISMATCH').length?\`<div class="err">\${(c.explanation?.verification_required||[]).filter(x=>x.status==='MISMATCH').length} affirmative mismatch(es)</div>\`:''}</details></td></tr>\`}).join('')}</tbody></table>\`;document.querySelectorAll('[data-rank-select]').forEach(el=>el.onchange=()=>{const selected=[...document.querySelectorAll('[data-rank-select]:checked')];if(el.checked&&selected.length>5){el.checked=false;alert('Stage 06 is limited to five businesses per controlled website research run.');return}evidence.ranked_candidates[Number(el.dataset.rankSelect)].operator_selected=el.checked;saveEvidence();render()})}`;
    html=html.slice(0,qualificationUiStart)+qualificationUiFunction+html.slice(qualificationUiEnd);

    const executionTail = '<div id="execMsg" class="msg"></div><div id="stageOutput"></div></section>';
    if (!html.includes(executionTail)) throw new Error('Execution output split marker not found.');
    html = html.replace(executionTail, '<div id="execMsg" class="msg"></div></section><section class="card"><div class="tag">Stage Output</div><div id="stageOutput"></div></section>');

    const operatorCss = `<style id="ngcc-v5-operator-style">
      .ngcc-command-grid{display:grid;grid-template-columns:minmax(360px,430px) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:18px}
      .ngcc-control-panel{position:sticky;top:58px;align-self:start;max-height:calc(100vh - 74px);overflow:auto;padding-right:2px}
      .ngcc-panel-heading{padding:4px 2px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
      .ngcc-panel-heading h2{font-size:25px;margin:.2rem 0 .35rem}
      .ngcc-panel-heading p{margin:0}
      .ngcc-control-actions{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 14px}
      .ngcc-control-actions #startNewTask{width:100%}
      .ngcc-control-panel>section.card{margin-bottom:14px;background:rgba(255,255,255,.045)}
      .ngcc-control-panel .row{display:grid;grid-template-columns:1fr;gap:10px}
      .ngcc-control-panel .row>div{min-width:0;flex:none}
      .ngcc-control-panel #searchOpps,#openNgccContractDrawer{width:100%;min-width:0}
      .ngcc-control-panel #execMsg{display:block;margin:9px 0 0}
      .ngcc-control-panel #opps{display:none!important}
      #openNgccContractDrawer[hidden]{display:none!important}
      .ngcc-monitor-panel{min-width:0}
      .ngcc-execution-dock{position:-webkit-sticky;position:sticky;top:54px;z-index:99960;margin:0 0 14px}
      .ngcc-execution-dock>section.card{margin:0;background:linear-gradient(135deg,rgba(15,42,106,.96),rgba(7,26,60,.96));border-color:rgba(213,174,85,.45);box-shadow:0 12px 30px rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
      .ngcc-execution-dock #execute{width:100%;min-width:0}
      @media(min-width:701px){
        .ngcc-execution-dock>section.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,230px) minmax(180px,220px);grid-template-rows:auto auto auto auto;column-gap:14px;row-gap:3px;align-items:center;padding:12px 16px}
        .ngcc-execution-dock #execTag{grid-column:1;grid-row:1}
        .ngcc-execution-dock #execTitle{grid-column:1;grid-row:2;margin:.1rem 0 .15rem;font-size:20px}
        .ngcc-execution-dock #execDesc{grid-column:1;grid-row:3;margin:0;font-size:11px}
        .ngcc-execution-dock label{grid-column:2;grid-row:1;margin:0}
        .ngcc-execution-dock #contractorState{grid-column:2;grid-row:2}
        .ngcc-execution-dock small.muted{grid-column:2;grid-row:3;margin:0!important}
        .ngcc-execution-dock #execute{grid-column:3;grid-row:2;align-self:stretch}
        .ngcc-execution-dock #execMsg{grid-column:1/-1;grid-row:4;margin-top:4px}
      }
      @media(max-width:700px){
        .ngcc-execution-dock{top:52px}
        .ngcc-execution-dock>section.card{max-height:calc(100vh - 64px);overflow:auto;padding:14px}
      }
      @media(max-width:620px){.ngcc-execution-dock{position:static}}
      .ngcc-monitor-panel .sidebar{position:static;top:auto;width:100%;margin:0 0 14px}
      .ngcc-monitor-panel .metrics{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}
      .ngcc-monitor-panel .metric strong{font-size:18px}
      .ngcc-results-workspace{display:grid;gap:16px;margin-top:2px}
      .brand{margin-bottom:16px}
      .ngcc-drawer-backdrop{position:fixed;z-index:99980;inset:46px 0 0;background:rgba(2,6,23,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
      .ngcc-contract-drawer{position:fixed;z-index:99990;top:46px;right:0;bottom:0;width:clamp(430px,42vw,680px);max-width:100vw;background:linear-gradient(160deg,#08162d,#0b2141);border-left:1px solid rgba(125,211,252,.3);box-shadow:-24px 0 70px rgba(0,0,0,.5);transform:translateX(102%);transition:transform .24s cubic-bezier(.22,.8,.2,1);display:flex;flex-direction:column;color:#eef4fb;overflow:hidden}
      .ngcc-contract-drawer.open{transform:translateX(0)}
      .ngcc-drawer-header{display:flex;justify-content:space-between;gap:16px;padding:20px 22px 15px;border-bottom:1px solid rgba(255,255,255,.12)}
      .ngcc-drawer-header h2{margin:2px 0 4px;font-size:25px}
      .ngcc-drawer-header p{margin:0;color:#aebccf}
      .ngcc-drawer-close{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:27px;cursor:pointer}
      .ngcc-drawer-tools{padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.09)}
      .ngcc-drawer-tools label{display:block;color:#9fb2c9;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
      .ngcc-drawer-tools input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(2,6,23,.5);color:#eef4fb;font:inherit}
      .ngcc-drawer-summary{margin:9px 0 0;color:#aebccf;font-size:11px}
      .ngcc-drawer-list{min-height:0;flex:1;padding:13px 14px 24px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px}
      .ngcc-drawer-item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:start;gap:12px;width:100%;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.045);color:#eef4fb;text-align:left;font:inherit}
      .ngcc-drawer-item:hover{background:rgba(125,211,252,.09);border-color:rgba(125,211,252,.44)}

      const loadPage=async page=>{page=Math.max(1,Number(page)||1);if(drawerBusy||page===drawerPage)return;if(page<drawerPage&&!drawerHasPrevious)return;if(page>drawerPage&&!drawerHasNext)return;drawerBusy=true;updatePager();list.innerHTML='<p class="muted">Loading contracts…</p>';try{const p=new URLSearchParams({limit:'30',page:String(page)});if(drawerScope.title)p.set('title',drawerScope.title);if(drawerScope.naics)p.set('naics',drawerScope.naics);if(drawerScope.state)p.set('state',drawerScope.state);const d=await req('/.netlify/functions/ngcc-ops-sam-opportunities?'+p);const pageResults=Array.isArray(d.results)?d.results:[];const activeCount=Number.isFinite(Number(d.active_count))?Number(d.active_count):pageResults.length;setResults(pageResults,{state:d.state||drawerScope.state,title:d.title||drawerScope.title,naics:(d.naicsCodes||[]).join(', ')||drawerScope.naics},{page:d.page||page,has_previous:Boolean(d.has_previous),has_next:Boolean(d.has_next),total_records:d.total_records??null});const oppsMsg=document.getElementById('oppsMsg');if(oppsMsg){oppsMsg.className=d.search_status==='SUCCESS_EMPTY'?'msg ok':'msg';oppsMsg.textContent=d.search_status==='SUCCESS_EMPTY'?'0 active SAM.gov opportunities loaded — no records matched this page of the current filter combination.':'SAM.gov contract batch '+drawerPage+' loaded — '+activeCount+' active opportunit'+(activeCount===1?'y':'ies')+' available.'}list.scrollTop=0;}catch(e){drawerBusy=false;updatePager();list.innerHTML='<p class="muted">Unable to load this contract batch: '+escDrawer(e.message||e)+'</p>';}};

    html = html.replace('</body>', operatorWorkflowScript + '</body>');

    const diagnosticCss = `<style id="ngcc-dev-diagnostics-style">body{padding-top:46px!important}#ngccDiagBar{position:fixed;z-index:999999;left:0;right:0;top:0;height:46px;background:#041229;border-bottom:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:10px;padding:0 12px;box-sizing:border-box;color:#fff;font-family:Arial,sans-serif}#ngccDiagBar strong{font-size:12px;letter-spacing:.08em;text-transform:uppercase}#ngccDiagStatus{font-size:11px;color:rgba(255,255,255,.72);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ngccDiagBar button{border:0;border-radius:5px;padding:8px 11px;font-weight:700;cursor:pointer}#ngccDownloadReport{background:#fff;color:#0f2a6a}#ngccClearReport{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.24)!important}</style>`;
    const diagnosticBar = `<div id="ngccDiagBar"><strong>Development Diagnostics</strong><span id="ngccDiagStatus">Initializing same-document diagnostics…</span><button id="ngccClearReport" type="button">Clear</button><button id="ngccDownloadReport" type="button">Download Job Report (.json)</button></div>`;
    html = html.replace('</head>', diagnosticCss + '</head>').replace('<body>', '<body>' + diagnosticBar);

    setTimeout(()=>{
      const events=[]; const maxEvents=500; const startedAt=new Date().toISOString();
      const statusEl=document.getElementById('ngccDiagStatus');
      const extensionPattern=/(chrome-extension:|moz-extension:|edge-extension:|injectedMethod(?:US|EU)?\.js|message channel closed)/i;
      const safe=v=>{try{return JSON.parse(JSON.stringify(v))}catch{return String(v)}};
      const text=id=>document.getElementById(id)?.textContent?.trim()||null;
      const val=id=>document.getElementById(id)?.value||null;
      const snapshot=()=>({mission_number:text('missionNumber'),mission_action:text('missionAction'),overall_percent:text('overallPct'),status:text('mStatus'),current_stage:text('mStage'),candidate_count:text('mCandidates'),keyword:val('keyword'),naics:val('naics'),contract_state:val('contractState'),contractor_state:val('contractorState'),opportunity_message:text('oppsMsg'),execution_title:text('execTitle'),execution_message:text('execMsg'),page_url:location.href});

      document.addEventListener('click',e=>{const el=e.target?.closest?.('button,a,.opp');if(!el)return;add('OPERATOR_ACTION',{element:el.tagName,id:el.id||null,text:(el.textContent||'').trim().slice(0,160),dataset:safe(el.dataset||{}),context:snapshot()})},true);
      document.getElementById('ngccClearReport').onclick=()=>{events.length=0;add('REPORT_CLEARED',{context:snapshot()})};
      document.getElementById('ngccDownloadReport').onclick=()=>{const extensionEvents=events.filter(e=>e.classification==='BROWSER_EXTENSION_OR_INJECTED_SCRIPT');const applicationFailures=events.filter(e=>['REQUEST_HTTP_FAILURE','REQUEST_NETWORK_FAILURE','WINDOW_ERROR','UNHANDLED_REJECTION'].includes(e.type)&&e.classification!=='BROWSER_EXTENSION_OR_INJECTED_SCRIPT');const report={report_type:'RFCP_COMMAND_CENTER_DEVELOPMENT_JOB_REPORT',report_version:'1.4',generated_at:new Date().toISOString(),session_started_at:startedAt,production_url:location.origin+'/ops-command-center',command_center_impl:'/ops-command-center-v5.html',browser:{user_agent:navigator.userAgent,language:navigator.language,online:navigator.onLine},current_state:snapshot(),summary:{event_count:events.length,application_failure_count:applicationFailures.length,extension_or_injected_script_event_count:extensionEvents.length},application_failures:applicationFailures,extension_or_injected_script_events:extensionEvents,events};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`RFCP-CommandCenter-JobReport-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);add('JOB_REPORT_DOWNLOADED',{summary:report.summary})};

})();
