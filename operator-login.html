<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RFCP Operator Sign In</title><style>body{margin:0;background:#071126;color:#eef3ff;font:16px/1.5 Arial,sans-serif}.card{max-width:480px;margin:12vh auto;padding:28px;background:#101d38;border:1px solid #334569;border-radius:14px}h1{margin-top:0}label{display:block;font-weight:700;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:7px;border:1px solid #657594;font:inherit}button{margin-top:20px;padding:12px 18px;background:#d5ae55;color:#071126;border:0;border-radius:7px;font-weight:800}.error{color:#ffb6be}</style></head><body><main class="card"><p>Registered Federal Contractors Portal · RFCP</p><h1>Operator sign in</h1><p>This restricted workspace is available only to authorized RFCP operators.</p><form id="form"><label for="password">Operator password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button><p id="status" class="error" role="alert"></p></form></main><script>const form=document.getElementById('form'),status=document.getElementById('status');form.onsubmit=async e=>{e.preventDefault();status.textContent='';const r=await fetch('/.netlify/functions/ngcc-ops-auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})}),d=await r.json().catch(()=>({}));if(!r.ok){status.textContent=d.error||'Access denied.';return}const requested=new URLSearchParams(location.search).get('returnTo')||'/ops-command-center';location.assign(requested.startsWith('/ops-')?requested:'/ops-command-center')};</script></body></html>
